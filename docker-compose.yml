services:
  notifier:
    # prebuilt multi-arch image (amd64/arm64); `docker compose up -d --build`
    # builds from source instead
    image: ghcr.io/xd33m/imax-seats:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # keep the state on the host so a restart does not re-announce everything
      STATE_FILE: /data/state.json
      HEALTH_FILE: /data/health
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
